    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#149c72" font-size="15" font-weight="700" letter-spacing=".6">Octagon Religious-Research Group</text><text x="56" y="122.2" fill="#d1fae5" font-size="60" font-weight="700" letter-spacing="-.5">Brand assets</text><text x="56" y="166.0" fill="#b5dcca" font-size="23">ORG's canonical marks. The existing ones, not a</text><text x="56" y="196.8" fill="#b5dcca" font-size="23">redesign.</text></g>
  </g>
</svg>
