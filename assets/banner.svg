    <path d="M989.5 125.0L922.6 64.7" stroke="#073d34" stroke-width="1"/>
    <path d="M989.5 125.0L984.8 35.1" stroke="#073d34" stroke-width="1"/>
    <path d="M989.5 125.0L1049.7 58.2" stroke="#073d34" stroke-width="1"/>
    <path d="M989.5 125.0L1079.4 120.4" stroke="#073d34" stroke-width="1"/>
    <path class="draw" pathLength="100" d="M1056.3 185.3 L994.1 214.9 L929.2 191.8 L899.6 129.6 L922.6 64.7 L984.8 35.1 L1049.7 58.2 L1079.4 120.4Z" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="arrive" style="animation-delay:0.35s" cx="1056.3" cy="185.3" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:0.71s" cx="994.1" cy="214.9" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.07s" cx="929.2" cy="191.8" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.44s" cx="899.6" cy="129.6" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.80s" cx="922.6" cy="64.7" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.16s" cx="984.8" cy="35.1" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.52s" cx="1049.7" cy="58.2" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.89s" cx="1079.4" cy="120.4" r="7" fill="#09181f" stroke="#75cdad" stroke-width="2.5"/>
